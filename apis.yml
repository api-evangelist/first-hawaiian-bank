name: First Hawaiian Bank
kind: company
description: First Hawaiian Bank is Hawaii's oldest and largest financial institution,
  founded in 1858 and headquartered at First Hawaiian Center in Honolulu. It is a
  Hawaii state-chartered commercial bank and member FDIC, operating as the principal
  subsidiary of First Hawaiian, Inc. (NASDAQ ticker FHB), a publicly traded bank holding
  company. The bank serves consumer and commercial customers through roughly 57 branches
  in Hawaii plus locations in Guam and Saipan, offering deposit accounts, lending,
  wealth management, treasury/cash management, and merchant services. On the open-finance
  front, First Hawaiian operates no public first-party developer portal and publishes
  no downloadable OpenAPI/Swagger specifications; probes of developer.fhb.com, api.fhb.com,
  and fhb.com/en/developers returned no host or HTTP 404. Consumer-permissioned account
  data is reachable only through third-party aggregators (notably Plaid), not a direct
  bank API. No documented Financial Data Exchange (FDX) participation or published
  CFPB Section 1033 data-access posture was found as of this record. Its commercial
  online banking product (FHB Commercial Online, formerly OBC) is a traditional web
  application rather than a developer-facing API surface.
