  name: First Hawaiian Bank Consumer Data Access (Aggregator-Only)
  description: First Hawaiian Bank exposes no public first-party API. Consumer-permissioned
    account and transaction data is available only through third-party financial data
    aggregators such as Plaid, which handle authentication and connectivity on the
    consumer's behalf. This entry documents that aggregator-only posture; it is not
    a first-party bank API.
